name: Keep Supabase awake

# Supabase pauses free-tier projects after ~7 days with no database activity.
# This runs a tiny read against the REST API every day so the project never
# crosses that line, even during a stretch where the board isn't opened.
#
# Caveat worth knowing: GitHub automatically disables scheduled workflows in a
# repo that has had no commits for 60 days. If that happens you'll get an email
# and can re-enable this from the Actions tab (any push re-arms it too).

on:
  schedule:
    # 13:17 UTC daily (~8:17am Central). Off-the-hour on purpose — cron jobs
    # scheduled at :00 sit in the longest queue on GitHub's shared runners.
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-supabase-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the boards table
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_KEY:-}" ]; then
            echo "::error::Missing repo secrets. Set VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY under Settings → Secrets and variables → Actions."
            exit 1
          fi

          # Trailing slashes in the secret would produce a double slash in the path.
          base="${SUPABASE_URL%/}"

          # A real PostgREST query, which is what Supabase counts as activity.
          # Row-level security means this returns an empty array rather than
          # anyone's data — that empty 200 is the success case.
          status=$(curl -sS \
            --max-time 30 \
            --retry 3 --retry-delay 15 --retry-connrefused \
            -o response.txt -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$base/rest/v1/boards?select=id&limit=1")

          echo "HTTP $status"
          echo "Response: $(cat response.txt)"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Supabase ping failed with HTTP $status — the project may be paused, or the key/table may have changed."
            exit 1
          fi

          echo "Supabase project pinged successfully."
